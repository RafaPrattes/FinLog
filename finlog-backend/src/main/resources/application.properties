spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=${FINLOG_DB_URL:jdbc:mysql://localhost:3306/finlog_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${FINLOG_DB_USERNAME:root}
spring.datasource.password=${FINLOG_DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1/models/gemini-3.6-flash:generateContent}

# Authentication
# Obrigatorio: pelo menos 32 caracteres aleatorios (ex.: openssl rand -base64 48)
app.auth.token-secret=${APP_AUTH_TOKEN_SECRET:}
app.auth.token-expiration-seconds=${APP_AUTH_TOKEN_EXPIRATION_SECONDS:3600}

# CORS: origens do frontend separadas por virgula
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
