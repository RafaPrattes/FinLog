spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=${FINLOG_DB_URL:jdbc:mysql://localhost:3306/finlog_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${FINLOG_DB_USERNAME:root}
spring.datasource.password=${FINLOG_DB_PASSWORD:123456}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Gemini
gemini.api.key=desativado
gemini.api.url=desativado

# Authentication
app.auth.token-secret=${APP_AUTH_TOKEN_SECRET:change-me-to-a-long-random-secret}
app.auth.token-expiration-seconds=${APP_AUTH_TOKEN_EXPIRATION_SECONDS:3600}