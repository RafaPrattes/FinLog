# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finlog_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent}

# Authentication
app.auth.token-secret=${APP_AUTH_TOKEN_SECRET}
app.auth.token-expiration-seconds=${APP_AUTH_TOKEN_EXPIRATION_SECONDS:3600}
