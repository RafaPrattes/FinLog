# ============================================================
#  FinLog - application.properties (MySQL + Hibernate)
#  Substitua os valores marcados com <...> pelos seus dados
# ============================================================

# --- Datasource ---
spring.datasource.url=jdbc:mysql://localhost:3306/finlogdb?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# "validate" → Hibernate valida as tabelas sem alterar nada (recomendado após criar o schema manualmente)
# "update"   → Hibernate altera as tabelas automaticamente (cuidado em produção)
# "create"   → Recria tudo ao iniciar (apaga dados existentes)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Console H2 (desabilitado) ---
spring.h2.console.enabled=false

# --- Gemini (desativado por ora) ---
gemini.api.key=desativado
gemini.api.url=desativado